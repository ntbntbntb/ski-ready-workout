function save(){localStorage.setItem('skiDone',JSON.stringify([...done]));renderProgress()}
function render(){const main=document.getElementById('list');let last=''; exercises.forEach((x,i)=>{if(x.section!==last){last=x.section;const sec=document.createElement('section');sec.className='section';sec.style.setProperty('--section',x.color);sec.dataset.section=x.section;sec.innerHTML=`<h2>${x.section}</h2>`;main.appendChild(sec)}const sec=main.lastElementChild;const b=document.createElement('button');b.className='exercise'+(done.has(i)?' done':'');b.style.setProperty('--color',x.color);b.dataset.i=i;b.innerHTML=`<span class="time">${x.time}</span><span><span class="name">${x.name}</span><span class="muscles">${x.muscles}</span></span><span class="check">${done.has(i)?'✓':'›'}</span>`;b.onclick=()=>select(i,true);sec.appendChild(b)});renderProgress()}
function renderProgress(){document.getElementById('progressText').textContent=`${done.size} van ${exercises.length} voltooid`;document.getElementById('fill').style.width=(done.size/exercises.length*100)+'%';document.querySelectorAll('.exercise').forEach((b,i)=>{b.classList.toggle('done',done.has(i));b.querySelector('.check').textContent=done.has(i)?'✓':'›'})}
function select(i,play=false){current=Math.max(0,Math.min(exercises.length-1,i));const x=exercises[current];document.getElementById('nowTime').textContent=x.time;document.getElementById('nowTitle').textContent=x.name;document.getElementById('fallback').href=`https://www.youtube.com/watch?v=8SLEwEPuPDo&t=${x.seconds}s`;document.querySelectorAll('.exercise').forEach((b,j)=>b.classList.toggle('active',j===current));const el=document.querySelector(`.exercise[data-i="${current}"]`);el?.scrollIntoView({behavior:'smooth',block:'center'});if(ready){try{player.seekTo(x.seconds,true);if(play)player.playVideo();document.getElementById('status').textContent=play?'Speelt':'Geselecteerd'}catch(err){reloadAt(x.seconds,play)}}else{document.getElementById('status').textContent='Speler laden…'}}
function reloadAt(seconds,play=false){const p=new URLSearchParams({enablejsapi:'1',playsinline:'1',rel:'0',start:String(seconds),autoplay:play?'1':'0'});if(ytOrigin)p.set('origin',ytOrigin);playerFrame.src='https://www.youtube.com/embed/8SLEwEPuPDo?'+p.toString();document.getElementById('status').textContent='Opnieuw geladen op '+exercises[current].time;}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player('player',{events:{onReady:()=>{ready=true;document.getElementById('status').textContent='Gereed';select(current,false)},onError:(e)=>{document.getElementById('notice').style.display='block';document.getElementById('status').textContent='Spelerfout '+e.data}}})}
document.getElementById('playPause').onclick=()=>{if(!ready)return;const s=player.getPlayerState();s===YT.PlayerState.PLAYING?player.pauseVideo():player.playVideo()};document.getElementById('markDone').onclick=()=>{done.has(current)?done.delete(current):done.add(current);save()};document.getElementById('next').onclick=()=>select(current+1,true);document.getElementById('prev').onclick=()=>select(current-1,true);document.getElementById('top').onclick=()=>document.querySelector(`.exercise[data-i="${current}"]`)?.scrollIntoView({behavior:'smooth',block:'center'});
render();select(0,false);
const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';tag.onerror=()=>{document.getElementById('notice').style.display='block';document.getElementById('status').textContent='YouTube API niet bereikbaar'};document.head.appendChild(tag);
</script>
</body></html>
